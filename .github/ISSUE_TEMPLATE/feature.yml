name: Feature request
description: Propose a new feature or change
title: "[Feat]: "
labels: ["feature", "needs-spec"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem this solves
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Testable conditions that mean this is done
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Project type
      options:
        - Fullstack (Nuxt/Next)
        - API / backend only
        - Landing page / marketing
        - Other
    validations:
      required: true
