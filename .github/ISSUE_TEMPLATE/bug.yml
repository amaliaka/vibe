name: Bug report
description: Report a defect
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Environment / context
      description: Browser, OS, auth state, etc.
